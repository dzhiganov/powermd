<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable variant: full-bleed background (no rounded corners — the
       OS applies its own mask shape), glyph kept inside the ~80% safe-zone
       circle (radius ~204.8 centered at 256,256) — the "M" glyph's bounding
       box below sits at most ~141px from center, comfortably inside that
       circle so no OS mask shape (circle, squircle, rounded-square, ...)
       clips it. -->
  <rect width="512" height="512" fill="#1c1b19" />
  <path
    d="M140,336 L140,176 L256,272 L372,176 L372,336"
    fill="none"
    stroke="#fbfaf8"
    stroke-width="40"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
