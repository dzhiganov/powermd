<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Editor</title>
    <script>
      // Sets data-theme before first paint so the page doesn't flash the
      // default theme then snap to the stored/resolved one. The stored
      // value is the user's *choice* — 'light', 'dark', or 'system' — must
      // match THEME_STORAGE_KEY / THEMES in src/shared/config/theme.ts, kept
      // in sync by hand since this script runs before any JS module (and
      // can't import it). 'system' (and anything missing/invalid, e.g. a
      // first visit) resolves against prefers-color-scheme right here,
      // matching what src/features/settings/model/theme.ts's
      // `$resolvedTheme` computes once the app hydrates — that store also
      // reacts live to prefers-color-scheme changing afterwards, but this
      // script only ever runs once, before paint. Wrapped in try/catch
      // because localStorage can throw in private browsing modes.
      try {
        var stored = localStorage.getItem('markdown-editor:theme')
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
